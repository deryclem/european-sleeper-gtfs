name: Generate GTFS

on:
  schedule:
    - cron: "0 4 * * 1"  # Every Monday at 04:00 UTC
  workflow_dispatch:       # Also allows manual trigger from the GitHub UI

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate GTFS feed
        run: python3 generate.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gtfs-european-sleeper.zip
          git diff --cached --quiet || git commit -m "chore: update GTFS feed $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
